<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Apuração 2º Turno 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: coluna única pensada para celular em pé; duas colunas de disputa a partir de 900px. */
  :root {
    --bg: #eceff3;
    --surface: #ffffff;
    --ink: #142030;
    --muted: #5a6778;
    --line: #d3dae3;
    --azul: #1b4e9e;
    --vermelho: #bf3a2c;
    --ouro: #b77d00;
    --ok: #1d7f47;
    --erro: #b42318;
    --whatsapp: #1a7f45;
    --whatsapp-hover: #156638;
    --sobre-whatsapp: #fff;
    --aviso-bg: #fff4d6;
    --branco-voto: #a9b4c2;
    --nulo-voto: #6c7889;
    --abstencao: #d9dfe7;
    --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --font-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d131a; --surface: #151f2a; --ink: #e6ecf2; --muted: #93a0b0; --line: #273443;
      --azul: #6a9be6; --vermelho: #ee6f61; --ouro: #f0b429; --ok: #46c27c; --erro: #f2685b;
      --aviso-bg: #3a2f10; --branco-voto: #8794a5; --nulo-voto: #5a6677; --abstencao: #2c3a4a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d131a; --surface: #151f2a; --ink: #e6ecf2; --muted: #93a0b0; --line: #273443;
    --azul: #6a9be6; --vermelho: #ee6f61; --ouro: #f0b429; --ok: #46c27c; --erro: #f2685b;
    --aviso-bg: #3a2f10; --branco-voto: #8794a5; --nulo-voto: #5a6677; --abstencao: #2c3a4a;
    color-scheme: dark;
  }

  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.45;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface);
  }

  .topo {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 10px;
  }
  .topo-linha { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .topo h1 {
    font-family: var(--font-display); font-weight: 700; font-size: 1.55rem;
    line-height: 1; margin: 0; letter-spacing: 0.01em; text-wrap: balance;
  }
  .topo-sub { margin: 2px 0 0; color: var(--muted); font-size: 0.78rem; }
  .online { font-size: 0.68rem; color: var(--muted); white-space: nowrap; }
  .online strong { color: var(--ok); font-weight: 600; font-variant-numeric: tabular-nums; }
  .topo-texto { flex: 1; min-width: 0; }
  .topo-autoria {
    margin: 0 0 3px; font-family: var(--font-display); font-weight: 500;
    font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  }
  .topo-autoria strong { color: var(--ouro); font-weight: 700; }
  .topo-estado { display: flex; flex-direction: column; align-items: center; gap: 3px; flex-shrink: 0; }
  .versao { font-size: 0.68rem; letter-spacing: 0.04em; color: var(--muted); font-variant-numeric: tabular-nums; }

  .status {
    display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
    font-family: var(--font-display); font-weight: 600; font-size: 0.9rem;
    letter-spacing: 0.06em; text-transform: uppercase;
    padding: 4px 10px 4px 8px; border-radius: 999px;
    border: 1px solid currentColor; color: var(--muted);
  }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .status[data-estado="ao-vivo"] { color: var(--ok); }
  .status[data-estado="ao-vivo"]::before { animation: pulso 1.2s ease-in-out infinite; }
  .status[data-estado="falha"] { color: var(--erro); }
  .status[data-estado="finalizada"] { color: var(--azul); }
  @keyframes pulso { 50% { opacity: 0.25; } }

  .relogio { position: relative; width: 30px; height: 30px; flex-shrink: 0; }
  .relogio svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .relogio circle { fill: none; stroke-width: 3; }
  .relogio .rel-fundo { stroke: var(--line); }
  .relogio .rel-valor { stroke: var(--ink); stroke-dasharray: 100 100; stroke-linecap: round; }
  .relogio.girando .rel-valor { animation: contagem 1s linear forwards; }
  @keyframes contagem { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 100; } }

  main {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 14px 28px;
  }
  .conteudo { max-width: 1100px; margin: 0 auto; display: grid; gap: 14px; }
  .disputas { display: grid; gap: 14px; }
  @media (min-width: 900px) { .disputas { grid-template-columns: 1fr 1fr; align-items: start; } }

  .aviso {
    background: var(--aviso-bg); border: 1px solid var(--ouro); border-radius: 10px;
    padding: 12px 14px; display: grid; gap: 8px; font-size: 0.88rem;
  }
  .aviso p { margin: 0; }

  .nova-versao {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--surface); border: 1px solid var(--azul); border-radius: 10px;
    padding: 10px 14px; font-size: 0.88rem;
  }
  .nova-versao[hidden] { display: none; }
  .nova-versao p { margin: 0; }
  .botao-atualizar {
    flex-shrink: 0; font: 600 0.88rem var(--font-body); color: var(--surface);
    background: var(--azul); border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer;
  }
  .botao-atualizar:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .disputa {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; display: grid; gap: 14px; min-width: 0;
  }
  .disputa-topo { display: grid; gap: 2px; }
  .eyebrow {
    margin: 0; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted);
  }
  .disputa h2 {
    margin: 2px 0 0; font-family: var(--font-display); font-weight: 700;
    font-size: 1.6rem; line-height: 1.05; text-wrap: balance;
  }

  .urnas {
    display: flex; align-items: center; gap: 12px;
    background: var(--bg); border-radius: 10px; padding: 8px 12px;
  }
  .anel { width: 46px; height: 46px; flex-shrink: 0; transform: rotate(-90deg); }
  .anel circle { fill: none; stroke-width: 7; }
  .anel-fundo { stroke: var(--line); }
  .anel-valor { stroke: var(--ouro); transition: stroke-dasharray 0.6s ease; }
  .urnas-texto { display: grid; gap: 1px; min-width: 0; line-height: 1.15; }
  .urnas-texto p { margin: 0; }
  .urnas-texto strong {
    font-family: var(--font-display); font-weight: 700; font-size: 1.6rem;
    font-variant-numeric: tabular-nums;
  }
  .urnas-texto span { font-size: 0.82rem; color: var(--muted); }
  .urnas-texto small { font-size: 0.74rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  .placar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cand {
    --cor: var(--azul);
    border-top: 4px solid var(--cor); padding-top: 8px; min-width: 0;
    display: grid; gap: 1px; align-content: start;
  }
  .cand.cor-vermelho { --cor: var(--vermelho); }
  .cand[data-slot="1"] { text-align: right; }
  .cand-num {
    font-family: var(--font-display); font-weight: 600; font-size: 0.85rem;
    color: var(--cor); letter-spacing: 0.04em;
  }
  .cand h3 {
    margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.15rem;
    line-height: 1.1; overflow-wrap: anywhere;
  }
  .cand-partido { margin: 0; font-size: 0.75rem; color: var(--muted); }
  .cand-pct {
    margin: 4px 0 0; font-family: var(--font-display); font-weight: 700;
    font-size: clamp(2.3rem, 11vw, 3.2rem); line-height: 1; color: var(--cor);
    font-variant-numeric: tabular-nums;
  }
  .cand-votos { margin: 0; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .selo {
    justify-self: start; margin-top: 6px; font-size: 0.7rem; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--surface);
    background: var(--cor); border-radius: 4px; padding: 2px 6px;
  }
  .cand[data-slot="1"] .selo { justify-self: end; }
  .cand.lider h3::after { content: " ▲"; font-size: 0.7em; color: var(--cor); }

  .barra {
    position: relative; display: flex; height: 18px; border-radius: 4px;
    overflow: hidden; background: var(--line);
  }
  .barra span { display: block; height: 100%; transition: width 0.6s ease; }
  .barra-a { background: var(--cor-a, var(--azul)); }
  .barra-b { background: var(--cor-b, var(--vermelho)); margin-left: auto; }
  .barra-meio {
    position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px;
    margin-left: -1px; background: var(--ink); opacity: 0.7;
  }
  .diferenca { margin: -6px 0 0; font-size: 0.85rem; text-align: center; color: var(--muted); }
  .diferenca strong { color: var(--ink); font-weight: 600; }

  .eleitorado { margin: 0; display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
  .eleitorado figcaption {
    display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
  }
  .eleitorado figcaption span { letter-spacing: 0.02em; text-transform: none; font-weight: 500; }
  .pilha { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--abstencao); }
  .pilha span { display: block; height: 100%; width: 0; transition: width 0.6s ease; }
  .pilha span + span { box-shadow: inset 1px 0 0 var(--surface); }
  /* Seis colunas: candidatos ocupam metade da linha cada; brancos, nulos e abstenção dividem a segunda linha. */
  .legenda {
    margin: 0; padding: 0; list-style: none;
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px 12px;
  }
  .legenda li {
    grid-column: span 2; min-width: 0; font-size: 0.76rem;
    display: grid; grid-template-columns: 10px minmax(0, 1fr); column-gap: 6px; align-items: center;
  }
  .legenda li:nth-child(-n+2) { grid-column: span 3; }
  .legenda i { width: 10px; height: 10px; border-radius: 2px; }
  .legenda .leg-nome { color: var(--muted); overflow-wrap: anywhere; line-height: 1.2; }
  .legenda strong {
    grid-column: 2; font-family: var(--font-display); font-weight: 600; font-size: 1.1rem;
    line-height: 1.1; font-variant-numeric: tabular-nums;
  }
  .seg-a { background: var(--cor-a, var(--azul)); }
  .seg-b { background: var(--cor-b, var(--vermelho)); }
  .seg-brancos { background: var(--branco-voto); }
  .seg-nulos { background: var(--nulo-voto); }
  .seg-abstencao { background: var(--abstencao); outline: 1px solid var(--line); outline-offset: -1px; }
  .carimbo { margin: -4px 0 0; font-size: 0.72rem; color: var(--muted); }

  .compartilhar {
    justify-self: center; display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 20px; border-radius: 999px; background: var(--whatsapp); color: var(--sobre-whatsapp);
    font: 600 0.95rem var(--font-body); text-decoration: none;
    box-shadow: 0 1px 2px rgb(0 0 0 / 0.15);
  }
  .compartilhar:hover { background: var(--whatsapp-hover); }
  .compartilhar:focus-visible { outline: 2px solid var(--azul); outline-offset: 3px; }
  .so-leitor {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }
  .compartilhar svg { width: 20px; height: 20px; flex-shrink: 0; }
  .compartilhar svg path { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }
  .compartilhar svg .compartilhar-fone { fill: currentColor; stroke: none; }
  .rodape { font-size: 0.75rem; color: var(--muted); display: grid; gap: 4px; }
  .rodape p { margin: 0; }

  @media (max-width: 380px) {
    .disputa { padding: 14px 12px; }
    .disputa h2 { font-size: 1.4rem; }
    .legenda { gap: 8px; }
    .topo h1 { font-size: 1.35rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .status::before, .relogio.girando .rel-valor { animation: none !important; }
    .barra span, .pilha span, .anel-valor { transition: none; }
  }
</style>

<header class="topo">
  <div class="topo-linha">
    <div class="topo-texto">
      <p class="topo-autoria">Produzido por <strong>E.R.A.</strong></p>
      <h1>Apuração 2º turno</h1>
      <p class="topo-sub">Dom., 25/10/2026 · a cada 1 s</p>
    </div>
    <div class="topo-estado">
      <span class="status" id="status" data-estado="conectando">Conectando</span>
      <span class="versao" id="versao">v1.2.0</span>
      <span class="online" id="online" hidden><strong id="online-qtd">1</strong> on-line</span>
    </div>
    <div class="relogio" id="relogio" title="Próxima consulta ao TSE">
      <svg viewBox="0 0 36 36" aria-hidden="true">
        <circle class="rel-fundo" cx="18" cy="18" r="15"></circle>
        <circle class="rel-valor" cx="18" cy="18" r="15" pathLength="100"></circle>
      </svg>
    </div>
  </div>
</header>

<main>
  <div class="conteudo">
    <section class="nova-versao" id="nova-versao" hidden>
      <p>Saiu uma versão nova desta página.</p>
      <button type="button" class="botao-atualizar" id="btn-atualizar">Atualizar</button>
    </section>

    <section class="aviso" id="aviso" hidden>
      <p id="aviso-texto"></p>
    </section>

    <div class="disputas" id="disputas"></div>

    <a class="compartilhar" href="https://wa.me/?text=Acompanhe%20ao%20vivo%20a%20apura%C3%A7%C3%A3o%20do%202%C2%BA%20turno%20%28Presidente%20e%20Governador%20do%20DF%29%3A%20https%3A%2F%2Flecoibr.github.io%2Fapuracao-tse-2026%2F" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3Z"></path><path class="compartilhar-fone" d="M9 8.2c.2-.4.5-.4.8-.4h.4c.2 0 .4.1.5.4l.7 1.6c.1.2 0 .5-.1.6l-.5.6c.6 1.2 1.6 2.2 2.8 2.8l.6-.5c.2-.2.4-.2.6-.1l1.6.7c.3.1.4.3.4.5v.4c0 .3 0 .6-.4.8-.5.3-1.2.5-1.9.3-2.6-.7-4.6-2.7-5.3-5.3-.2-.7 0-1.4.3-1.9Z"></path></svg>
      Compartilhar no WhatsApp<span class="so-leitor"> (abre em outra aba)</span>
    </a>

    <footer class="rodape">
      <p>A votação termina às 17h (horário de Brasília); a divulgação começa logo depois.</p>
    </footer>
  </div>
</main>

<template id="tpl-disputa">
  <article class="disputa">
    <header class="disputa-topo">
      <p class="eyebrow" data-ref="abrangencia"></p>
      <h2 data-ref="titulo"></h2>
    </header>
    <div class="urnas">
      <svg class="anel" viewBox="0 0 52 52" aria-hidden="true">
        <circle class="anel-fundo" cx="26" cy="26" r="21"></circle>
        <circle class="anel-valor" data-ref="anel" cx="26" cy="26" r="21" pathLength="100" stroke-dasharray="0 100"></circle>
      </svg>
      <div class="urnas-texto">
        <p><strong data-ref="urnasPct">0,00%</strong> <span>das urnas apuradas</span></p>
        <small data-ref="urnasQtd"></small>
      </div>

    <div class="placar">
      <div class="cand" data-slot="0">
        <span class="cand-num" data-ref="num"></span>
        <h3 data-ref="nome">—</h3>
        <p class="cand-partido" data-ref="partido"></p>
        <p class="cand-pct" data-ref="pct">0,00%</p>
        <p class="cand-votos" data-ref="votos">0 votos</p>
        <span class="selo" data-ref="selo" hidden>Eleito(a)</span>
      </div>
      <div class="cand" data-slot="1">
        <span class="cand-num" data-ref="num"></span>
        <h3 data-ref="nome">—</h3>
        <p class="cand-partido" data-ref="partido"></p>
        <p class="cand-pct" data-ref="pct">0,00%</p>
        <p class="cand-votos" data-ref="votos">0 votos</p>
        <span class="selo" data-ref="selo" hidden>Eleito(a)</span>
      </div>
    </div>

    <div class="barra" data-ref="barra" role="img" aria-label="Divisão dos votos válidos">
      <span class="barra-a" data-ref="barraA" style="width:0%"></span>
      <span class="barra-b" data-ref="barraB" style="width:0%"></span>
      <i class="barra-meio" aria-hidden="true"></i>
    </div>
    <p class="diferenca" data-ref="diferenca">Aguardando o início da apuração.</p>

    <figure class="eleitorado">
      <figcaption>Eleitorado das seções apuradas <span data-ref="comparecimento">Comparecimento —</span></figcaption>
      <div class="pilha" data-ref="pilha" role="img" aria-label="Composição do eleitorado das seções apuradas">
        <span class="seg-a" data-seg="a"></span>
        <span class="seg-b" data-seg="b"></span>
        <span class="seg-brancos" data-seg="brancos"></span>
        <span class="seg-nulos" data-seg="nulos"></span>
      </div>
      <ul class="legenda">
        <li><i class="seg-a"></i><span class="leg-nome" data-leg-nome="a">—</span><strong data-leg="a">—</strong></li>
        <li><i class="seg-b"></i><span class="leg-nome" data-leg-nome="b">—</span><strong data-leg="b">—</strong></li>
        <li><i class="seg-brancos"></i><span class="leg-nome">Brancos</span><strong data-leg="brancos">—</strong></li>
        <li><i class="seg-nulos"></i><span class="leg-nome">Nulos</span><strong data-leg="nulos">—</strong></li>
        <li><i class="seg-abstencao"></i><span class="leg-nome">Abstenção</span><strong data-leg="abstencao">—</strong></li>
      </ul>
    </figure>
    <p class="carimbo" data-ref="atualizado">Sem dados ainda.</p>
  </article>
</template>

<script>
(() => {
  "use strict";

  const BASE_TSE = "https://resultados.tse.jus.br/oficial/ele2026";
  const INTERVALO_MS = 1000;
  const TIMEOUT_MS = 8000;
  const FALHAS_PARA_AVISO = 2;
  const ROTULOS_ELEITORADO = { brancos: "Brancos", nulos: "Nulos", abstencao: "Abstenção" };

  // Partidos com cor fixa; quem não estiver aqui recebe a cor do slot (azul à esquerda, vermelho à direita).
  const COR_POR_PARTIDO = { "13": "vermelho", "22": "azul", "11": "azul" };

  /**
   * Disputas acompanhadas. "ordem" fixa a posição de cada candidato pelo número de urna,
   * para o placar não trocar de lado quando a liderança muda.
   */
  const DISPUTAS = [
    {
      id: "presidente",
      titulo: "Presidente da República",
      abrangencia: "Brasil",
      url: `${BASE_TSE}/6258/dados/br/br-c0001-e006258-u.json`,
      ordem: ["22", "13"],
      candidatosIniciais: [
        { numero: "22", nome: "FLAVIO BOLSONARO", partido: "PL" },
        { numero: "13", nome: "LULA", partido: "PT" }
      ]
    },
    {
      id: "governador-df",
      titulo: "Governador",
      abrangencia: "Distrito Federal",
      url: `${BASE_TSE}/6260/dados/df/df-c0003-e006260-u.json`,
      ordem: ["11", "13"],
      candidatosIniciais: [
        { numero: "11", nome: "CELINA LEÃO", partido: "PP" },
        { numero: "13", nome: "LEANDRO GRASS", partido: "PT" }
      ]
    }
  ];

  const fmtInteiro = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 0 });
  const fmtPct = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtPctCurto = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });

  const estado = {
    falhasSeguidas: 0,
    timer: null,
    rodada: 0,
    paineis: new Map()
  };

  const el = {
    disputas: document.getElementById("disputas"),
    status: document.getElementById("status"),
    relogio: document.getElementById("relogio"),
    aviso: document.getElementById("aviso"),
    avisoTexto: document.getElementById("aviso-texto")
  };

  /** Converte números no formato do TSE ("47,03", "158745502") para Number; valor ausente ou inválido vira 0. */
  function numeroTse(valor) {
    if (valor === undefined || valor === null || valor === "") {
      return 0;
    }
    const numero = Number(String(valor).replaceAll(".", "").replace(",", "."));
    return Number.isFinite(numero) ? numero : 0;
  }

  /** Percorre agremiações → partidos → candidatos do arquivo de resultado e devolve uma lista plana. */
  function extrairCandidatos(cargo) {
    const lista = [];
    for (const agremiacao of cargo.agr || []) {
      for (const partido of agremiacao.par || []) {
        for (const cand of partido.cand || []) {
          lista.push({
            numero: String(cand.n ?? ""),
            nome: cand.nmu || cand.nm || "Candidato",
            partido: partido.sg || "",
            votos: numeroTse(cand.vap),
            // No TSE, "e" = "s" também marca quem foi para o 2º turno; só conta como eleito sem essa situação.
            eleito: cand.e === "s" && !/turno/i.test(cand.st || ""),
            seq: numeroTse(cand.seq)
          });
        }
      }
    }
    return lista;
  }

  function ordenarCandidatos(candidatos, ordemPreferida) {
    const posicao = (c) => {
      const i = ordemPreferida.indexOf(c.numero);
      return i === -1 ? ordemPreferida.length + c.seq : i;
    };
    return [...candidatos].sort((a, b) => posicao(a) - posicao(b));
  }

  /**
   * Transforma o JSON bruto do TSE no modelo usado pela tela.
   * Lança erro se o arquivo não tiver o bloco de cargo, para a consulta ser tratada como falha.
   */
  function interpretarResultado(json, disputa) {
    const cargo = json && Array.isArray(json.carg) ? json.carg[0] : null;
    if (!cargo) {
      throw new Error("Arquivo do TSE sem dados de cargo");
    }
    const secoes = json.s || {};
    const eleitorado = json.e || {};
    const votos = json.v || {};
    const votosValidos = numeroTse(votos.vv);
    const candidatos = ordenarCandidatos(extrairCandidatos(cargo), disputa.ordem).slice(0, 2)
      .map((c) => ({ ...c, pct: votosValidos > 0 ? (c.votos / votosValidos) * 100 : 0 }));

    return {
      candidatos,
      votosValidos,
      urnasPct: numeroTse(secoes.pstn ?? secoes.pst),
      secoesTotalizadas: numeroTse(secoes.st),
      secoesTotal: numeroTse(secoes.ts),
      comparecimentoPct: numeroTse(eleitorado.pcn ?? eleitorado.pc),
      comparecimento: numeroTse(eleitorado.c),
      abstencao: numeroTse(eleitorado.a),
      brancos: numeroTse(votos.vb),
      nulos: numeroTse(votos.tvn),
      atualizadoEm: [json.dg, json.hg].filter(Boolean).join(" "),
      finalizada: json.tf === "s"
    };
  }

  async function buscarJson(url) {
    const controle = new AbortController();
    const prazo = setTimeout(() => controle.abort(), TIMEOUT_MS);
    try {
      const resposta = await fetch(url, { cache: "no-store", signal: controle.signal });
      if (!resposta.ok) {
        throw new Error(`TSE respondeu HTTP ${resposta.status}`);
      }
      return await resposta.json();
    } finally {
      clearTimeout(prazo);
    }
  }

  function corDoCandidato(cand, slot) {
    return COR_POR_PARTIDO[cand.numero] || (slot === 0 ? "azul" : "vermelho");
  }

  function criarPainel(disputa) {
    const fragmento = document.getElementById("tpl-disputa").content.cloneNode(true);
    const raiz = fragmento.querySelector(".disputa");
    const ref = (nome, base = raiz) => base.querySelector(`[data-ref="${nome}"]`);
    const slots = [...raiz.querySelectorAll(".cand")].map((no) => ({
      no,
      num: ref("num", no), nome: ref("nome", no), partido: ref("partido", no),
      pct: ref("pct", no), votos: ref("votos", no), selo: ref("selo", no)
    }));
    ref("titulo").textContent = disputa.titulo;
    ref("abrangencia").textContent = disputa.abrangencia;
    el.disputas.appendChild(fragmento);
    return {
      raiz, slots,
      urnasPct: ref("urnasPct"), urnasQtd: ref("urnasQtd"), anel: ref("anel"),
      barra: ref("barra"), barraA: ref("barraA"), barraB: ref("barraB"),
      diferenca: ref("diferenca"),
      comparecimento: ref("comparecimento"), pilha: ref("pilha"), atualizado: ref("atualizado"),
      segmentos: Object.fromEntries([...raiz.querySelectorAll("[data-seg]")].map((n) => [n.dataset.seg, n])),
      legendas: Object.fromEntries([...raiz.querySelectorAll("[data-leg]")].map((n) => [n.dataset.leg, n])),
      nomesLegenda: Object.fromEntries([...raiz.querySelectorAll("[data-leg-nome]")].map((n) => [n.dataset.legNome, n]))
    };
  }

  /** Índice do candidato à frente (0 ou 1), ou -1 em empate ou sem os dois candidatos. */
  function indiceLider(a, b) {
    if (!a || !b || a.votos === b.votos) {
      return -1;
    }
    return a.votos > b.votos ? 0 : 1;
  }

  function renderizarCandidatos(painel, resultado) {
    const lider = indiceLider(resultado.candidatos[0], resultado.candidatos[1]);
    for (const [i, slot] of painel.slots.entries()) {
      const cand = resultado.candidatos[i];
      if (!cand) {
        continue;
      }
      const cor = corDoCandidato(cand, i);
      slot.no.classList.toggle("cor-vermelho", cor === "vermelho");
      slot.no.classList.toggle("lider", i === lider && resultado.votosValidos > 0);
      slot.num.textContent = cand.numero;
      slot.nome.textContent = cand.nome;
      slot.partido.textContent = cand.partido;
      slot.pct.textContent = `${fmtPct.format(cand.pct)}%`;
      slot.votos.textContent = `${fmtInteiro.format(cand.votos)} votos`;
      slot.selo.hidden = !cand.eleito;
      painel.raiz.style.setProperty(i === 0 ? "--cor-a" : "--cor-b", `var(--${cor})`);
    }
  }

  function renderizarBarra(painel, resultado) {
    const [a, b] = resultado.candidatos;
    const temVotos = resultado.votosValidos > 0 && a && b;
    painel.barraA.style.width = `${temVotos ? a.pct : 0}%`;
    painel.barraB.style.width = `${temVotos ? b.pct : 0}%`;
    if (!temVotos) {
      painel.diferenca.textContent = resultado.urnasPct > 0
        ? "Urnas apuradas sem votos válidos computados ainda."
        : "Aguardando o início da apuração.";
      painel.barra.setAttribute("aria-label", "Sem votos válidos computados");
      return;
    }
    painel.barra.setAttribute("aria-label",
      `${a.nome} ${fmtPct.format(a.pct)}%, ${b.nome} ${fmtPct.format(b.pct)}%`);
    const diferencaVotos = Math.abs(a.votos - b.votos);
    if (diferencaVotos === 0) {
      painel.diferenca.textContent = "Empate em votos válidos.";
      return;
    }
    const lider = a.votos > b.votos ? a : b;
    painel.diferenca.replaceChildren(
      document.createTextNode(`${lider.nome} à frente por `),
      Object.assign(document.createElement("strong"), { textContent: `${fmtInteiro.format(diferencaVotos)} votos` }),
      document.createTextNode(` (${fmtPct.format(Math.abs(a.pct - b.pct))} p.p.)`)
    );
  }

  /**
   * Barra empilhada do eleitorado das seções já apuradas: votos de cada candidato, brancos, nulos e abstenção.
   * A base é comparecimento + abstenção, que corresponde ao eleitorado das seções totalizadas.
   */
  function renderizarEleitorado(painel, resultado) {
    const [a, b] = resultado.candidatos;
    painel.nomesLegenda.a.textContent = a ? a.nome : "—";
    painel.nomesLegenda.b.textContent = b ? b.nome : "—";
    const base = resultado.comparecimento + resultado.abstencao;
    const fatias = {
      a: a ? a.votos : 0,
      b: b ? b.votos : 0,
      brancos: resultado.brancos,
      nulos: resultado.nulos,
      abstencao: resultado.abstencao
    };
    const partes = [];
    for (const [chave, valor] of Object.entries(fatias)) {
      const pct = base > 0 ? (valor / base) * 100 : 0;
      if (painel.segmentos[chave]) {
        painel.segmentos[chave].style.width = `${pct}%`;
      }
      painel.legendas[chave].textContent = base > 0 ? `${fmtPctCurto.format(pct)}%` : "—";
      partes.push(`${painel.nomesLegenda[chave]?.textContent || ROTULOS_ELEITORADO[chave]} ${fmtPctCurto.format(pct)}%`);
    }
    painel.comparecimento.textContent = base > 0
      ? `Comparecimento ${fmtPctCurto.format(resultado.comparecimentoPct)}%`
      : "Comparecimento —";
    painel.pilha.setAttribute("aria-label", base > 0 ? partes.join(", ") : "Sem seções apuradas");
  }

  function renderizarDisputa(disputa, resultado) {
    const painel = estado.paineis.get(disputa.id);
    painel.urnasPct.textContent = `${fmtPct.format(resultado.urnasPct)}%`;
    painel.urnasQtd.textContent = resultado.secoesTotal > 0
      ? `${fmtInteiro.format(resultado.secoesTotalizadas)} de ${fmtInteiro.format(resultado.secoesTotal)} seções`
      : "";
    painel.anel.setAttribute("stroke-dasharray", `${Math.min(100, resultado.urnasPct).toFixed(2)} 100`);
    renderizarCandidatos(painel, resultado);
    renderizarBarra(painel, resultado);
    renderizarEleitorado(painel, resultado);
    const situacao = resultado.finalizada ? " · totalização concluída" : "";
    painel.atualizado.textContent = resultado.atualizadoEm
      ? `Dados gerados pelo TSE em ${resultado.atualizadoEm}${situacao}`
      : "Horário de geração não informado pelo TSE.";
  }

  function definirStatus(codigo, texto) {
    el.status.dataset.estado = codigo;
    el.status.textContent = texto;
  }

  function mostrarAviso(texto) {
    el.avisoTexto.textContent = texto;
    el.aviso.hidden = false;
  }

  function reiniciarRelogio() {
    el.relogio.classList.remove("girando");
    // A leitura de offsetWidth força reflow, para a animação da contagem recomeçar do zero a cada ciclo.
    el.relogio.dataset.reflow = String(el.relogio.offsetWidth);
    el.relogio.classList.add("girando");
  }

  async function atualizarAoVivo(rodada) {
    const respostas = await Promise.allSettled(DISPUTAS.map((d) => buscarJson(d.url)));
    if (rodada !== estado.rodada) {
      return;
    }
    let sucessos = 0;
    let todasFinalizadas = true;
    let algumaComUrnas = false;
    for (const [i, resposta] of respostas.entries()) {
      const disputa = DISPUTAS[i];
      if (resposta.status !== "fulfilled") {
        console.warn(`Falha ao consultar ${disputa.id}`, resposta.reason);
        continue;
      }
      try {
        const resultado = interpretarResultado(resposta.value, disputa);
        renderizarDisputa(disputa, resultado);
        sucessos += 1;
        todasFinalizadas = todasFinalizadas && resultado.finalizada;
        algumaComUrnas = algumaComUrnas || resultado.urnasPct > 0;
      } catch (erro) {
        console.warn(`Resposta inesperada do TSE para ${disputa.id}`, erro);
      }
    }

    if (sucessos === 0) {
      estado.falhasSeguidas += 1;
      definirStatus("falha", "Sem conexão");
      if (estado.falhasSeguidas >= FALHAS_PARA_AVISO) {
        mostrarAviso("Não foi possível ler os arquivos do TSE. Verifique a conexão com a internet; "
          + "o servidor do TSE também pode estar instável. A página continua tentando a cada 1 segundo.");
      }
      return;
    }
    estado.falhasSeguidas = 0;
    el.aviso.hidden = true;
    if (sucessos === DISPUTAS.length && todasFinalizadas) {
      definirStatus("finalizada", "Finalizada");
    } else if (algumaComUrnas) {
      definirStatus("ao-vivo", "Ao vivo");
    } else {
      definirStatus("ao-vivo", "Aguardando");
    }
  }

  async function ciclo() {
    clearTimeout(estado.timer);
    // Cada chamada invalida as anteriores, evitando dois laços de consulta em paralelo
    // quando o usuário volta para a aba no meio de uma requisição.
    const rodada = ++estado.rodada;
    await atualizarAoVivo(rodada);
    if (rodada === estado.rodada && !document.hidden) {
      reiniciarRelogio();
      estado.timer = setTimeout(ciclo, INTERVALO_MS);
    }
  }

  /** Resultado zerado, exibido até a primeira resposta do TSE chegar. */
  function resultadoVazio(disputa) {
    return {
      candidatos: disputa.candidatosIniciais.map((c, i) => ({ ...c, votos: 0, pct: 0, eleito: false, seq: i + 1 })),
      votosValidos: 0, urnasPct: 0, secoesTotalizadas: 0, secoesTotal: 0,
      comparecimentoPct: 0, comparecimento: 0, abstencao: 0, brancos: 0, nulos: 0,
      atualizadoEm: "", finalizada: false
    };
  }

  function zerarPaineis() {
    for (const disputa of DISPUTAS) {
      renderizarDisputa(disputa, resultadoVazio(disputa));
      estado.paineis.get(disputa.id).atualizado.textContent = "Sem dados ainda.";
    }
  }

  async function manterTelaLigada() {
    try {
      if ("wakeLock" in navigator && !document.hidden) {
        await navigator.wakeLock.request("screen");
      }
    } catch (erro) {
      console.info("Tela pode apagar: wake lock indisponível", erro);
    }
  }

  function iniciar() {
    for (const disputa of DISPUTAS) {
      estado.paineis.set(disputa.id, criarPainel(disputa));
    }
    zerarPaineis();
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        manterTelaLigada();
        ciclo();
      } else {
        clearTimeout(estado.timer);
      }
    });
    manterTelaLigada();
    ciclo();
  }

  iniciar();
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js" integrity="sha384-u4uqeACkFcoKl57rBQJHVGDd1pqhW4w8X3WjTu1ZksPdxoLqdt34jpoNkJisE25W" crossorigin="anonymous"></script>
<script>
/**
 * Contador de pessoas com a página aberta, por presença num broker MQTT público.
 * Cada aparelho publica uma mensagem retida no próprio tópico e registra um "last will" vazio,
 * que o broker publica sozinho quando a conexão cai: o registro some sem depender da página.
 * Os registros são renovados periodicamente e os antigos são descartados, para não contar
 * aparelhos órfãos caso o broker perca algum "last will".
 */
(() => {
  "use strict";

  const BROKER_URL = "wss://broker.hivemq.com:8884/mqtt";
  const TOPICO_BASE = "era-apuracao-tse-2026/v1/online/";
  const RENOVACAO_MS = 120000;
  const VALIDADE_MS = 300000;
  const VARREDURA_MS = 30000;
  const TOLERANCIA_RELOGIO_MS = 600000;
  const LIMITE_REGISTROS = 100000;
  const ID_VALIDO = /^[a-f0-9-]{16,64}$/;

  const elOnline = document.getElementById("online");
  const elQtd = document.getElementById("online-qtd");
  if (!elOnline || !elQtd || typeof globalThis.mqtt?.connect !== "function") {
    return;
  }

  const fmtQtd = new Intl.NumberFormat("pt-BR");
  const meuId = gerarId();
  const meuTopico = TOPICO_BASE + meuId;
  // id do aparelho -> momento (relógio local) em que o registro foi visto válido pela última vez
  const vistos = new Map();

  function gerarId() {
    if (typeof crypto.randomUUID === "function") {
      return crypto.randomUUID();
    }
    const bytes = crypto.getRandomValues(new Uint8Array(16));
    return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
  }

  function mensagemPresenca() {
    return JSON.stringify({ t: Date.now() });
  }

  /** Lê o carimbo de tempo da mensagem; devolve null se o conteúdo não for o esperado. */
  function lerMomento(payload) {
    try {
      const dados = JSON.parse(new TextDecoder().decode(payload));
      return Number.isFinite(dados?.t) ? dados.t : null;
    } catch (erro) {
      console.debug("Mensagem de presença ignorada", erro);
      return null;
    }
  }

  function exibir() {
    elQtd.textContent = fmtQtd.format(Math.max(1, vistos.size));
  }

  function descartarAntigos() {
    const limite = Date.now() - VALIDADE_MS;
    for (const [id, visto] of vistos) {
      if (id !== meuId && visto < limite) {
        vistos.delete(id);
      }
    }
    exibir();
  }

  /**
   * Mensagens retidas chegam na inscrição e podem ser antigas: a idade vem do carimbo do remetente.
   * As demais acabaram de ser publicadas, então valem o horário local de chegada.
   */
  function registrar(topico, payload, retida) {
    const id = topico.slice(TOPICO_BASE.length);
    if (!ID_VALIDO.test(id)) {
      return;
    }
    if (payload.length === 0) {
      vistos.delete(id);
      exibir();
      return;
    }
    const momento = lerMomento(payload);
    if (momento === null) {
      return;
    }
    const agora = Date.now();
    // Carimbo muito à frente do relógio local não é diferença de fuso: seria um registro que nunca expira.
    if (momento > agora + TOLERANCIA_RELOGIO_MS) {
      return;
    }
    const idade = retida ? Math.max(0, agora - momento) : 0;
    if (idade > VALIDADE_MS ||(!vistos.has(id) && vistos.size >= LIMITE_REGISTROS)) {
      return;
    }
    vistos.set(id, agora - idade);
    exibir();
  }

  function publicarPresenca(cliente) {
    if (cliente.connected) {
      cliente.publish(meuTopico, mensagemPresenca(), { qos: 1, retain: true });
    }
  }

  const cliente = globalThis.mqtt.connect(BROKER_URL, {
    clientId: `era-${meuId.slice(0, 20)}`,
    clean: true,
    keepalive: 30,
    reconnectPeriod: 5000,
    connectTimeout: 10000,
    will: { topic: meuTopico, payload: "", qos: 1, retain: true }
  });

  cliente.on("connect", () => {
    // A cada (re)conexão o broker reenvia os registros retidos, então a lista recomeça do zero.
    vistos.clear();
    vistos.set(meuId, Date.now());
    cliente.subscribe(`${TOPICO_BASE}+`, { qos: 0 });
    publicarPresenca(cliente);
    exibir();
    elOnline.hidden = false;
  });
  cliente.on("message", (topico, payload, pacote) => registrar(topico, payload, pacote.retain));
  cliente.on("offline", () => {
    elOnline.hidden = true;
  });
  cliente.on("error", (erro) => console.warn("Contador de pessoas on-line indisponível", erro));

  setInterval(() => publicarPresenca(cliente), RENOVACAO_MS);
  setInterval(() => {
    vistos.set(meuId, Date.now());
    descartarAntigos();
  }, VARREDURA_MS);

  // Ao sair, apaga o próprio registro na hora; se não der tempo, o "last will" do broker faz isso.
  globalThis.addEventListener("pagehide", () => {
    if (cliente.connected) {
      cliente.publish(meuTopico, "", { qos: 0, retain: true });
    }
  });
})();
</script>

<script>
/**
 * Avisa quando há uma versão publicada mais nova que a aberta neste aparelho.
 * A versão de referência fica em versao.json, publicado junto com a página;
 * a recarga usa ?v=<versão> na URL para não receber a cópia antiga guardada em cache.
 */
(() => {
  "use strict";

  const URL_VERSAO = "versao.json";
  const INTERVALO_VERIFICACAO_MS = 60000;
  const FORMATO_VERSAO = /^v(\d{1,4})\.(\d{1,4})\.(\d{1,4})$/;

  const elVersao = document.getElementById("versao");
  const elAviso = document.getElementById("nova-versao");
  const btnAtualizar = document.getElementById("btn-atualizar");
  if (!elVersao || !elAviso || !btnAtualizar) {
    return;
  }
  const versaoAtual = elVersao.textContent.trim();
  let versaoNova = null;

  function partes(versao) {
    const casamento = FORMATO_VERSAO.exec(versao);
    return casamento ? casamento.slice(1).map(Number) : null;
  }

  function ehMaisNova(candidata, atual) {
    const a = partes(candidata);
    const b = partes(atual);
    if (!a || !b) {
      return false;
    }
    const indice = a.findIndex((n, i) => n !== b[i]);
    return indice !== -1 && a[indice] > b[indice];
  }

  async function verificar() {
    if (document.hidden || versaoNova) {
      return;
    }
    try {
      const resposta = await fetch(`${URL_VERSAO}?t=${Date.now()}`, { cache: "no-store" });
      if (!resposta.ok) {
        return;
      }
      const dados = await resposta.json();
      if (typeof dados?.versao === "string" && ehMaisNova(dados.versao, versaoAtual)) {
        versaoNova = dados.versao;
        elAviso.hidden = false;
      }
    } catch (erro) {
      console.info("Não foi possível verificar se há versão nova", erro);
    }
  }

  btnAtualizar.addEventListener("click", () => {
    const destino = new URL(location.href);
    destino.search = `?v=${encodeURIComponent(versaoNova || versaoAtual)}`;
    location.replace(destino.toString());
  });
  document.addEventListener("visibilitychange", verificar);
  setInterval(verificar, INTERVALO_VERIFICACAO_MS);
  verificar();
})();
</script>
